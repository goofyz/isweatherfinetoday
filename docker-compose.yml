version: '3.8'
services:
  db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=abcd1234
      - POSTGRES_DB=weatherindoubt6_development
      - PGDATA=/var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  # redis:
  #   image: redis:latest
  #   ports:
  #     - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile.node
    command: npm run dev
    ports:
      - "3010:3000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://postgres:abcd1234@db:5432/weatherindoubt6_development
      - TZ=Asia/Hong_Kong
      - FCM_API_KEY=AAAAtqyD6eo:APA91bHNmYeIrDWX7LJB4VXEbMx5Bqd34IRepuoY-swKlmNikG3784gAdX-9j_RaKalRvJHyhT7C0gCF-7SpTzgAjRXO4XnB3mJLiTyWE69YbrJB6Ju4AzWX2mtB327T5X5MkylA6j5B
    volumes:
      - .:/app

  # scheduler:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.node
  #   command: node src/scheduler.js
  #   depends_on:
  #     - db
  #   environment:
  #     - DATABASE_URL=postgres://postgres:abcd1234@db:5432/weatherindoubt6_development
  #     - TZ=Asia/Hong_Kong
  #   volumes:
  #     - .:/app

volumes:
  dbdata: